name: Bot de chollos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-chollos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install feedparser requests

      - name: Buscar chollos
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar ofertas vistas
        run: |
          git config user.name "bot-chollos"
          git config user.email "bot-chollos@users.noreply.github.com"
          git add vistos.json
          git diff --staged --quiet || (git commit -m "Actualizar vistos" && git push)